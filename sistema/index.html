<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЕГМ · Единая система</title>
<style>:root{--or:#E3120B;--or2:#c20e08;--orl:#fdecea;--gr:#141518;--gr2:#4a525c;--mut:#6b737c;--line:#e3e6ea;--bg:#f5f6f8;--ok:#1f9d55;--bad:#d64545;--warn:#e0a100;--blue:#3b7ddd;--r:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--gr);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--or2)}
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
#side{background:var(--gr);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding:14px 10px 20px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;border-bottom:1px solid #343a42;margin-bottom:8px}
.brand .logo{height:52px;width:auto;flex:none}
.brand b{font-size:17px;letter-spacing:.3px}.brand small{display:block;opacity:.7;font-size:11.5px}
#nav a{display:flex;gap:9px;align-items:center;color:#e9ecef;text-decoration:none;padding:7px 10px;border-radius:8px;font-size:13.5px}
#nav a:hover{background:#2c3239}
#nav a.on{background:var(--or);color:#fff}
#nav .ic{width:20px;text-align:center}
#nav .ng{font-size:11px;text-transform:uppercase;letter-spacing:.6px;opacity:.75;margin:14px 10px 4px}
#nav .homeLink{font-weight:600}
.sidefoot{margin-top:16px;padding:10px;border-top:1px solid #343a42;font-size:12px;opacity:.85}
.sidefoot button{width:100%;margin-top:8px;background:transparent;border:1px solid #4a525c;color:#fff;border-radius:8px;padding:7px;cursor:pointer}
#top{display:none}
#main{min-width:0}
.view{padding:20px 24px 40px;max-width:1500px}
h1.pt{margin:0 0 4px;font-size:22px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-size:24px;color:var(--or2);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--gr2)}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--or);color:#fff;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600;text-decoration:none}
.btn:hover{background:var(--or2)}
.btn.sec{background:#fff;color:var(--gr);border:1px solid var(--line);font-weight:500}
.btn.sec:hover{border-color:var(--or)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;font-size:12.5px;color:var(--gr2);margin-bottom:10px}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid #cfd4da;border-radius:8px;background:#fff}
label.f>input:focus,label.f>select:focus,label.f>textarea:focus{outline:2px solid var(--orl);border-color:var(--or)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--gr2);font-size:12px;border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap}
table.t td{border-bottom:1px solid #eef0f3;padding:8px;vertical-align:top}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#fafbfc}
.tw{overflow-x:auto}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);white-space:nowrap}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:12px;background:#eef0f3;color:var(--gr2);white-space:nowrap}
.chip.or{background:var(--orl);color:var(--or2)}
.muted{color:var(--mut)}.small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{margin-left:auto}
.note{background:var(--orl);border-left:4px solid var(--or);padding:10px 12px;border-radius:8px;font-size:13px}
.empty{color:var(--mut);text-align:center;padding:24px}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--gr);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:340px;transition:.4s}
.toast.out{opacity:0;transform:translateY(8px)}
.modal{position:fixed;inset:0;background:rgba(20,22,26,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;z-index:150;overflow:auto}
.mbox{background:#fff;border-radius:14px;width:min(640px,100%);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mhead{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:16px}
.mhead .x{margin-left:auto;border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--mut)}
.mbody{padding:16px}
/* телефон-рамка для ботов */
.phone{width:360px;max-width:100%;height:640px;border:10px solid #141518;border-radius:34px;background:#e7ebf0;display:flex;flex-direction:column;overflow:hidden;margin:0 auto}
.phone .ph{background:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.phone .ph .av{width:34px;height:34px;border-radius:50%;background:var(--or);color:#fff;display:grid;place-items:center;font-weight:700}
.phone .msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:8px 11px;border-radius:12px;background:#fff;font-size:13.5px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.msg.me{align-self:flex-end;background:#dff3d6}
.msg small{display:block;color:var(--mut);font-size:11px;margin-top:3px;text-align:right}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;background:#f2f4f7;border-top:1px solid var(--line)}
.kb button{background:#fff;border:1px solid #d6dbe1;border-radius:9px;padding:9px 6px;cursor:pointer;font-size:13px}
.kb button:hover{border-color:var(--or)}
.kb button.wide{grid-column:1/-1}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:100;transform:translateX(-100%);transition:.25s}
  #app.navopen #side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  #top{display:flex;align-items:center;gap:10px;background:var(--gr);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:90}
  #top button{background:none;border:1px solid #4a525c;color:#fff;border-radius:8px;padding:5px 10px;font-size:18px;cursor:pointer}
  .view{padding:14px 12px 30px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g4.kpis{grid-template-columns:1fr 1fr}
}

.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow .fs{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;width:118px;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;color:var(--gr);text-decoration:none;font-size:12.5px}
.flow .fs:hover{border-color:var(--or);background:var(--orl)}
.flow .fs span{font-size:22px}.flow i{color:var(--or);font-style:normal;font-weight:700}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mod{display:flex;flex-direction:column;gap:2px;padding:10px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--gr)}
.mod:hover{border-color:var(--or)}.mod span{font-size:20px}.mod small{color:var(--mut)}
.dlay{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col{background:#eef0f3;border-radius:10px;padding:8px;min-height:200px}
.col h3{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between}
.col h3 span{background:#fff;border-radius:9px;padding:0 8px;font-size:12px}
.oc{background:#fff;border:1px solid var(--line);border-left:4px solid var(--or);border-radius:8px;padding:9px;margin-bottom:7px;cursor:pointer}
.oc:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.oc select{width:100%;margin-top:7px;padding:6px;border:1px solid var(--or);border-radius:7px;background:var(--orl);font-size:12.5px}
.truck{padding:8px 0;border-bottom:1px solid #eef0f3}
.sumbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;white-space:pre-wrap;font-size:13.5px;line-height:1.55}
.cal-res{font-size:28px;font-weight:800;color:var(--or2)}
.site{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.site .hero{background:linear-gradient(120deg,#1F2329 0%,#2d333b 60%,#3a2a1c 100%);color:#fff;padding:34px 30px}
.site .hero h2{font-size:30px;margin:0 0 8px;line-height:1.15}.site .hero h2 b{color:var(--or)}
.site .nav{display:flex;gap:18px;align-items:center;padding:12px 30px;border-bottom:1px solid var(--line);font-size:13.5px}
.site .sec{padding:24px 30px}
.prod{border:1px solid var(--line);border-radius:12px;padding:12px}
.prod .pic{height:70px;border-radius:8px;margin-bottom:8px}
@media (max-width:1100px){.dlay{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.board{grid-template-columns:1fr}.site .hero h2{font-size:22px}.site .nav{flex-wrap:wrap;gap:10px}}
</style></head>

  function calcPrice({ materialId, volume, unit, zoneId, urgent, night }) {
    const m = MATERIALS.find(x => x.id === materialId) || MATERIALS[0];
    const z = ZONES.find(x => x.id === zoneId) || ZONES[0];
    volume = Number(volume) || 0;
    let tons = 0, trips = 0, materialSum = 0;
    if (m.unit === 'рейс') { trips = Math.max(1, Math.ceil(volume)); materialSum = trips * m.price; }
    else {
      tons = unit === 'м3' ? +(volume * m.density).toFixed(1) : volume;
      trips = Math.max(1, Math.ceil(tons / TRUCK_T));
      materialSum = Math.round(tons * m.price);
    }
    let delivery = m.unit === 'рейс' ? 0 : trips * z.trip;
    if (m.unit === 'рейс' && z.id !== 'z1') delivery = trips * (z.trip - ZONES[0].trip);
    let k = 1; if (urgent) k += 0.1; if (night) k += 0.15;
    const total = Math.round((materialSum + delivery) * k / 10) * 10;
    return { material: m, zone: z, tons, trips, materialSum, delivery, coef: k, total };

      mk(1045, 'c1', 'sand_m', 25, 'т', 'z2', 'Котельники, ЖК «Новые Котельники», корп. 4', TODAY, '08:00–11:00', 'transit', { truckId: 't1', driverId: 'd1', saby: 'synced' }),
      mk(1046, 'c5', 'gr_5_20', 30, 'т', 'z1', 'Москва, Варшавское ш., 170, траншея ВК', TODAY, '09:00–12:00', 'assigned', { truckId: 't4', driverId: 'd4', saby: 'exported' }),
      mk(1047, 'c6', 'snow', 4, 'рейс', 'z1', 'Москва, Дмитровское ш., 89, парковка ТЦ', TODAY, '22:00–02:00', 'confirmed'),
      mk(1048, 'c2', 'lime_20_40', 100, 'т', 'z3', 'Раменское, Донинское ш., участок дороги км 5', TODAY, '10:00–16:00', 'confirmed'),
      mk(1049, 'c4', 'soil', 15, 'м3', 'z2', 'Видное, СНТ «Берёзка», уч. 112', TODAY, '14:00–17:00', 'new', { source: 'site' }),
    ];
    const calls = [];
    return {
      v: 1, today: TODAY, clients, drivers, trucks, orders, calls,
      leads: [],            // база обзвона (наполняет модуль CRM)
      notifications: [],    // сообщения клиентам/водителям/директору {t, to:'client'|'driver'|'director'|'office', clientId?, driverId?, orderId?, channel, text}
      log: [],              // общий журнал действий
      seq: 1050,
    };
  }

  // ---------- хранилище ----------
  let db;
  const subs = [];
  function load() {
    try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) { db = null; }
    if (!db || db.v !== 1) { db = seed(); persist(); }
    return db;
  }
  function persist() { localStorage.setItem(KEY, JSON.stringify(db)); }
  function emit() { subs.forEach(f => { try { f(db); } catch (e) { console.error(e); } }); }
  window.addEventListener('storage', e => { if (e.key === KEY) { load(); emit(); } });

  function now() { const d = new Date(); return db.today + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function update(fn, logText, who) {
    fn(db);
    if (logText) db.log.unshift({ t: now(), who: who || 'Система', text: logText });
    db.log = db.log.slice(0, 300);
    persist(); emit();
  }
  function notify(n) { db.notifications.unshift(Object.assign({ t: now(), id: 'n' + Date.now() + Math.random().toString(36).slice(2, 5) }, n)); }

  const CLIENT_MSG = {
    confirmed: o => `Заявка ${o.no} принята: ${mat(o).name}, ${vol(o)}, ${fmtDate(o.date)} ${o.slot}. Сумма ${money(o.total)}.`,
    assigned: o => `По заявке ${o.no} назначена машина ${truck(o)?.plate || ''}, водитель ${driver(o)?.name || ''}.`,
    transit: o => `Машина по заявке ${o.no} выехала к вам. Ориентировочное прибытие — в течение 1–1,5 ч.`,
    arrived: o => `Машина по заявке ${o.no} на объекте, начинает выгрузку.`,
    done: o => `Заявка ${o.no} выполнена: выгружено ${vol(o)}. Документы будут в личном кабинете.`,
    cancelled: o => `Заявка ${o.no} отменена. Если это ошибка — позвоните нам.`,
  };
  // единая смена статуса: пишет историю, двигает машину, шлёт уведомления
  function setStatus(orderId, status, who = 'Диспетчер', note) {
    update(d => {
      const o = d.orders.find(x => x.id === orderId); if (!o) return;
      o.status = status;
      o.history.push({ t: now(), who, text: (STATUSES[status]?.name || status) + (note ? ' — ' + note : '') });
      const t = d.trucks.find(x => x.id === o.truckId);
      if (t) t.state = ['done', 'cancelled'].includes(status) ? 'free' : 'busy';
      if (CLIENT_MSG[status]) notify({ to: 'client', clientId: o.clientId, orderId: o.id, channel: 'Telegram', text: CLIENT_MSG[status](o) });
      if (status === 'done' || status === 'cancelled') notify({ to: 'director', orderId: o.id, text: `${o.no}: ${STATUSES[status].name.toLowerCase()}` });
    }, `${o_no(orderId)}: ${STATUSES[status]?.name}`, who);
  }
  function o_no(id) { return db.orders.find(x => x.id === id)?.no || id; }
  function assign(orderId, truckId, who = 'Диспетчер') {
    update(d => {
      const o = d.orders.find(x => x.id === orderId); const t = d.trucks.find(x => x.id === truckId);
      if (!o || !t) return;
      o.truckId = t.id; o.driverId = t.driverId; o.status = 'assigned'; t.state = 'busy';
      o.history.push({ t: now(), who, text: `Назначена машина ${t.plate}` });
      notify({ to: 'driver', driverId: t.driverId, orderId: o.id, channel: driverById(t.driverId)?.messenger, text: `Новое задание ${o.no}: ${mat(o).name}, ${vol(o)} → ${o.address}, ${o.slot}` });
      notify({ to: 'client', clientId: o.clientId, orderId: o.id, channel: 'Telegram', text: CLIENT_MSG.assigned(o) });
    }, `${o_no(orderId)}: назначена машина`, who);
  }
  function addOrder(data, who = 'Менеджер') {
    let created;
    update(d => {
      const p = calcPrice(data);
      const cl = d.clients.find(x => x.id === data.clientId);
      const disc = cl ? cl.discount : 0;
      created = Object.assign({
        id: 'o' + d.seq, no: 'З-' + d.seq, status: 'new', truckId: null, driverId: null, saby: 'none', source: 'phone',
        paid: false, comment: '', photos: [], date: d.today, slot: '09:00–12:00', created: now(),
        history: [], unit: 'т', zoneId: 'z1',
      }, data, { tons: p.tons, trips: p.trips, total: data.total || Math.round(p.total * (1 - disc / 100) / 10) * 10 });
      created.history.push({ t: now(), who, text: 'Заявка создана (' + ({ phone: 'звонок', site: 'сайт', bot: 'бот', cabinet: 'личный кабинет', crm: 'CRM' }[created.source] || created.source) + ')' });
      d.seq++; d.orders.push(created);
      notify({ to: 'office', orderId: created.id, text: `Новая заявка ${created.no} (${created.source})` });
    }, 'Новая заявка', who);
    return created;
  }
  function upsertClient(c) {
    let res;
    update(d => {
      res = d.clients.find(x => x.phone.replace(/\D/g, '') === (c.phone || '').replace(/\D/g, ''));
      if (!res) { res = Object.assign({ id: 'c' + Date.now(), type: 'Новый', manager: 'Анна', terms: 'предоплата', discount: 0, debt: 0, inn: '' }, c); d.clients.push(res); }
    });
    return res;
  }

  // ---------- хелперы ----------
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => (Math.round(n) || 0).toLocaleString('ru-RU').replace(/,/g, ' ') + ' ₽';
  const fmtDate = s => { const d = new Date(s + 'T12:00'); return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' + WD[d.getDay()]; };
  const mat = o => MATERIALS.find(x => x.id === o.materialId) || MATERIALS[0];
  const vol = o => o.unit === 'рейс' ? `${o.volume} рейс.` : `${o.volume} ${o.unit === 'м3' ? 'м³' : 'т'}` + (o.unit === 'м3' ? ` (${o.tons} т)` : '');
  const client = o => db.clients.find(x => x.id === o.clientId);
  const truck = o => db.trucks.find(x => x.id === o.truckId);
  const driver = o => db.drivers.find(x => x.id === o.driverId);
  const driverById = id => db.drivers.find(x => x.id === id);
  const zone = o => ZONES.find(x => x.id === o.zoneId) || ZONES[0];
  function badge(status) { const s = STATUSES[status] || { name: status, color: '#999' }; return `<span class="badge" style="--c:${s.color}">${esc(s.name)}</span>`; }
  function toast(text) {
    let w = $('#toasts'); if (!w) { w = document.createElement('div'); w.id = 'toasts'; document.body.appendChild(w); }
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; w.appendChild(t);
    setTimeout(() => t.classList.add('out'), 2600); setTimeout(() => t.remove(), 3100);
  }
  function modal(title, html, onMount) {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="mbox"><div class="mhead"><b>${esc(title)}</b><button class="x" aria-label="Закрыть">×</button></div><div class="mbody">${html}</div></div>`;
    document.body.appendChild(m);
    const close = () => { m.remove(); document.removeEventListener('keydown', k); };
    const k = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', k);
    m.addEventListener('click', e => { if (e.target === m || e.target.classList.contains('x')) close(); });
    if (onMount) onMount(m.querySelector('.mbody'), close);
    return close;
  }

  // ---------- модули и роутер ----------
  const mods = [];
  let current = null;
  function mod(def) { mods.push(def); }   // {id, title, group, icon, order, render(el, api)} ; render может вернуть cleanup()
  let cleanup = null;
  function route() {
    const id = (location.hash.slice(2) || 'home');
    const m = mods.find(x => x.id === id) || mods.find(x => x.id === 'home') || mods[0];
    if (!m) return;
    if (cleanup) { try { cleanup(); } catch (e) { } cleanup = null; }
    current = m;
    $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.id === m.id));
    const el = $('#view'); el.innerHTML = ''; el.className = 'view v-' + m.id;
    document.title = 'ЕГМ · ' + m.title;
    const r = m.render(el, api); if (typeof r === 'function') cleanup = r;
    window.scrollTo(0, 0);
    $('#app').classList.remove('navopen');
  }
  function rerenderOnChange(fn) { subs.push(fn); return () => { const i = subs.indexOf(fn); if (i >= 0) subs.splice(i, 1); }; }
  function go(id) { location.hash = '#/' + id; }

  function reset() { localStorage.removeItem(KEY); load(); emit(); route(); toast('Демо-данные сброшены'); }

  const api = {
    get db() { return db; }, TODAY, MATERIALS, ZONES, STATUSES, FLOW, TRUCK_T,
    calcPrice, update, notify, setStatus, assign, addOrder, upsertClient, on: rerenderOnChange, go, reset, now,
    $, $$, esc, money, fmtDate, mat, vol, client, truck, driver, driverById, zone, badge, toast, modal, mods,
  };
  window.EGM = api; window.EGM.mod = mod;

  function boot() {
    load();
    const groups = {};
    mods.sort((a, b) => (a.order || 99) - (b.order || 99)).forEach(m => { if (m.id === 'home') return; (groups[m.group] = groups[m.group] || []).push(m); });
    $('#nav').innerHTML = `<a href="#/home" data-id="home" class="homeLink">⌂ Обзор системы</a>` + Object.entries(groups).map(([g, list]) =>
      `<div class="ng">${esc(g)}</div>` + list.map(m => `<a href="#/${m.id}" data-id="${m.id}"><span class="ic">${m.icon || '•'}</span>${esc(m.title)}</a>`).join('')).join('');
    $('#resetBtn').onclick = () => { if (confirm('Сбросить демо-данные к исходным?')) reset(); };
    $('#burger').onclick = () => $('#app').classList.toggle('navopen');
    window.addEventListener('hashchange', route);
    // перехват ссылок на модули внутри страниц: data-go="orders"
    document.addEventListener('click', e => { const a = e.target.closest('[data-go]'); if (a) { e.preventDefault(); go(a.dataset.go); } });
    route();
  }
  document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 0));
})();

      <label class="f">Контакт на объекте<input id="ct"></label>
      <label class="f">Материал<select id="m">${A.MATERIALS.map(m => `<option value="${m.id}">${m.name}</option>`).join('')}</select></label>
      <div class="row" style="gap:6px"><label class="f" style="flex:1">Объём<input id="v" type="number" min="1" value="25"></label>
        <label class="f" style="width:90px">Ед.<select id="u"><option value="т">т</option><option value="м3">м³</option><option value="рейс">рейс</option></select></label></div>
      <label class="f">Зона доставки<select id="z">${A.ZONES.map(z => `<option value="${z.id}">${z.name}</option>`).join('')}</select></label>
      <label class="f">Дата<input id="d" type="date" value="${db.today}"></label>
      <label class="f">Интервал<select id="s">${['07:00–10:00', '08:00–11:00', '09:00–12:00', '12:00–15:00', '14:00–17:00', '22:00–02:00'].map(s => `<option>${s}</option>`).join('')}</select></label>
      <label class="f">Источник<select id="src"><option value="phone">Звонок</option><option value="crm">Обзвон (CRM)</option><option value="site">Сайт</option></select></label>
    </div>
    <label class="f">Адрес выгрузки<input id="a" placeholder="Город, улица, ориентир, подъезд"></label>
    <label class="f">Комментарий<textarea id="cm" rows="2" placeholder="Условия подъезда, ограничение по тоннажу..."></textarea></label>
    <div class="note" id="calc"></div>
    <div class="row" style="margin-top:12px"><span class="muted small" id="err"></span><button class="btn sp" id="save">Сохранить и подтвердить</button></div>`, (b, close) => {
    let cl = null;
    const $ = s => b.querySelector(s);
    const recalc = () => {
      const unit = $('#u').value, m = A.MATERIALS.find(x => x.id === $('#m').value);
      if (m.unit === 'рейс' && unit !== 'рейс') $('#u').value = 'рейс';
      if (m.unit !== 'рейс' && unit === 'рейс') $('#u').value = 'т';
      const p = A.calcPrice({ materialId: $('#m').value, volume: $('#v').value, unit: $('#u').value, zoneId: $('#z').value });
      const disc = cl?.discount || 0; const tot = Math.round(p.total * (1 - disc / 100) / 10) * 10;
      $('#calc').innerHTML = `${p.tons ? `<b>${p.tons} т</b> · ` : ''}${p.trips} маш. · материал ${A.money(p.materialSum)} + доставка ${A.money(p.delivery)}${disc ? ` · скидка клиента ${disc}%` : ''}<br><b style="font-size:16px">Итого: ${A.money(tot)}</b>`;
      return tot;
    };
    const look = () => {
      const d = $('#ph').value.replace(/\D/g, '');
      cl = d.length >= 10 ? A.db.clients.find(c => c.phone.replace(/\D/g, '').endsWith(d.slice(-10))) : null;
      if (cl) {
        $('#cn').value = cl.name; $('#ct').value = cl.contact;
        const last = A.db.orders.filter(o => o.clientId === cl.id).sort((a, b) => b.date.localeCompare(a.date))[0];
        $('#found').innerHTML = `✓ Клиент найден: <b>${A.esc(cl.name)}</b> · ${A.esc(cl.terms)}${cl.debt ? ` · <span style="color:var(--bad)">долг ${A.money(cl.debt)}</span>` : ''}` +

        const r = b.querySelector('#rep'); if (r) r.onclick = e => { e.preventDefault(); $('#m').value = last.materialId; $('#v').value = last.volume; $('#u').value = last.unit; $('#z').value = last.zoneId; $('#a').value = last.address; recalc(); };
      } else $('#found').textContent = d.length >= 10 ? 'Новый клиент — будет добавлен в базу' : '';

    $('#ph').oninput = look;
    ['materialId:#m', 'volume:#v', 'unit:#u', 'zoneId:#z', 'address:#a'].forEach(p => { const [k, s] = p.split(':'); if (preset[k] != null) $(s).value = preset[k]; });

      if (need.length) { $('#err').textContent = 'Заполните: ' + need.map(x => x[1]).join(', '); return; }
      const c = cl || A.upsertClient({ name: $('#cn').value.trim(), phone: $('#ph').value.trim(), contact: $('#ct').value.trim() || $('#cn').value.trim() });
      const o = A.addOrder({ clientId: c.id, phone: $('#ph').value.trim(), contact: $('#ct').value.trim() || c.contact, materialId: $('#m').value, volume: +$('#v').value, unit: $('#u').value,
        zoneId: $('#z').value, date: $('#d').value, slot: $('#s').value, address: $('#a').value.trim(), comment: $('#cm').value.trim(), source: $('#src').value, total: recalc() }, c.manager || 'Менеджер');
      A.setStatus(o.id, 'confirmed', c.manager || 'Менеджер');
      close(); A.toast(`Заявка ${o.no} сохранена · клиенту ушло подтверждение`);
    };
  });
}

      else if (st === 'mat') list = A.MATERIALS.slice(0, 8).map(m => ({ t: m.name, f: () => { draft.materialId = m.id; draft.unit = m.unit === 'рейс' ? 'рейс' : 'т'; say(m.name, 1); st = 'vol'; say(m.unit === 'рейс' ? 'Сколько рейсов?' : 'Сколько тонн?'); } }));
      else if (st === 'vol') list = (draft.unit === 'рейс' ? [1, 2, 3, 5] : [15, 25, 50, 100]).map(v => ({ t: v + (draft.unit === 'рейс' ? ' рейс.' : ' т'), f: () => { draft.volume = v; say(v + ' ' + draft.unit, 1); st = 'adr'; say('Куда везём?'); } }));
      else if (st === 'adr') list = [...new Set(my.map(o => o.address))].slice(0, 3).map(a => ({ t: a, w: 1, f: () => pickAdr(a) })).concat([{ t: '✏ Другой адрес', w: 1, f: () => { const a = prompt('Адрес выгрузки'); if (a) pickAdr(a); } }]);
      else if (st === 'ok') { const p = A.calcPrice(Object.assign({ zoneId: draft.zoneId || 'z1' }, draft)); list = [{ t: `✅ Подтвердить · ${A.money(Math.round(p.total * (1 - c.discount / 100) / 10) * 10)}`, w: 1, f: () => { const o = A.addOrder(Object.assign({ clientId: c.id, phone: c.phone, contact: c.contact, source: 'cabinet', date: '2026-11-12', slot: '09:00–12:00' }, draft), c.contact); say('Подтверждаю', 1); say(`Готово! Заявка ${o.no} на 12 ноября, 09:00–12:00. Менеджер её подтвердит, а статус машины придёт сюда.`); st = null; draft = {}; A.toast('Заявка из бота появилась в общей базе'); } }, { t: 'Отмена', w: 1, f: () => { st = null; draft = {}; say('Отмена', 1); say('Хорошо. Чем ещё помочь?'); } }]; }
      function pickAdr(a) { draft.address = a; const prev = my.find(o => o.address === a); draft.zoneId = prev ? prev.zoneId : 'z2'; say(a, 1); st = 'ok'; const p = A.calcPrice(draft); say(`Проверьте заказ:\n${A.MATERIALS.find(m => m.id === draft.materialId).name}, ${draft.volume} ${draft.unit}\n📍 ${a}\n🗓 завтра, 09:00–12:00\nСумма: ${A.money(Math.round(p.total * (1 - c.discount / 100) / 10) * 10)}`); }
      function repeat() { if (!last) return; say('Повторить последний', 1); draft = { materialId: last.materialId, volume: last.volume, unit: last.unit, zoneId: last.zoneId, address: last.address }; st = 'ok'; say(`Повторяем ${last.no}: ${A.mat(last).name}, ${A.vol(last)} → ${last.address}. На завтра, 09:00–12:00?`); }
      btns(list);
      A.$$('#kb button', el).forEach(b => b.onclick = () => { list[+b.dataset.i].f(); draw(); });
      A.$('#rep', el).onclick = () => { repeat(); draw(); };
      A.$('#cs', el).onchange = e => { cid = e.target.value; chat = []; st = null; draft = {}; draw(); };
      const m = A.$('#cm', el); m.scrollTop = m.scrollHeight;
    };
    draw(); return A.on(draw);
  }
});

EGM.mod({

  render(el, A) {
    const col = { sand_k: '#d9b77e', sand_m: '#e6cf9c', gr_20_40: '#8c8f94', gr_5_20: '#a3a6ab', lime_20_40: '#cfc8b8', pgs: '#b59a72', soil: '#5b4632', recycle: '#7d7570' };

      <div class="sec"><h2 style="margin-top:0">Материалы</h2><div class="grid g4">${A.MATERIALS.filter(m => m.unit !== 'рейс').map(m => `<div class="prod"><div class="pic" style="background:radial-gradient(circle at 30% 40%,#ffffff40 0 6%,transparent 7%),radial-gradient(circle at 70% 60%,#00000020 0 8%,transparent 9%),${col[m.id]}"></div><b>${m.name}</b><div class="small muted">от ${A.money(m.price)}/т</div></div>`).join('')}</div></div>
      <div class="sec" id="calcS" style="background:#fafbfc"><h2 style="margin-top:0">Рассчитать и заказать</h2><div class="grid g2">
        <div><label class="f">Материал<select id="sm">${A.MATERIALS.map(m => `<option value="${m.id}">${m.name}</option>`).join('')}</select></label>
          <div class="row" style="gap:8px"><label class="f" style="flex:1">Объём<input id="sv" type="number" value="25" min="1"></label><label class="f" style="width:100px">Ед.<select id="su"><option value="т">т</option><option value="м3">м³</option><option value="рейс">рейс</option></select></label></div>
          <label class="f">Куда<select id="sz">${A.ZONES.map(z => `<option value="${z.id}">${z.name}</option>`).join('')}</select></label></div>
        <div><div class="small muted">Стоимость с доставкой</div><div class="cal-res" id="st"></div><div class="small muted" id="sd"></div>
          <label class="f" style="margin-top:10px">Телефон<input id="sp" placeholder="+7 ..."></label><label class="f">Адрес объекта<input id="sa"></label><button class="btn" id="sgo">Оставить заявку</button></div></div></div>
      <div class="sec small muted">© ЕГМ · нерудные материалы · Москва и Московская область</div></div>`;
    const $ = s => A.$(s, el);
    const rc = () => { const m = A.MATERIALS.find(x => x.id === $('#sm').value); if (m.unit === 'рейс') $('#su').value = 'рейс'; else if ($('#su').value === 'рейс') $('#su').value = 'т'; const p = A.calcPrice({ materialId: m.id, volume: $('#sv').value, unit: $('#su').value, zoneId: $('#sz').value }); $('#st').textContent = A.money(p.total); $('#sd').textContent = `${p.tons ? p.tons + ' т · ' : ''}${p.trips} машин`; };
    ['#sm', '#sv', '#su', '#sz'].forEach(s => $(s).oninput = rc); rc();
    $('#sgo').onclick = () => {
      const ph = $('#sp').value.trim(), ad = $('#sa').value.trim(); if (ph.replace(/\D/g, '').length < 10 || !ad) { A.toast('Укажите телефон и адрес'); return; }
      const c = A.upsertClient({ name: 'Клиент с сайта ' + ph, phone: ph, contact: 'с сайта' });
      const o = A.addOrder({ clientId: c.id, phone: ph, contact: c.contact, materialId: $('#sm').value, volume: +$('#sv').value, unit: $('#su').value, zoneId: $('#sz').value, address: ad, source: 'site', date: '2026-11-12' }, 'Сайт');
      A.toast(`Заявка ${o.no} с сайта у менеджера (раздел «Заявки», статус «Новая»)`); $('#sp').value = ''; $('#sa').value = '';
    };
  }
});
